<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Cashfy — твои траты под контролем</title>
  <meta name="description"
    content="Cashfy — трекер трат с характером: понятные категории, лимиты, статистика и итоги года. Тёмная тема, зелёный акцент.">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231DB954'/%3E%3Crect x='9' y='16' width='3' height='8' rx='1.5' fill='%23000'/%3E%3Crect x='14.5' y='9' width='3' height='15' rx='1.5' fill='%23000'/%3E%3Crect x='20' y='13' width='3' height='11' rx='1.5' fill='%23000'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ==== SVG sprite ==== -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-home" viewBox="0 0 24 24">
      <path d="M3 10.6 12 3.4l9 7.2V20a1 1 0 0 1-1 1h-5.1v-6.3H9.1V21H4a1 1 0 0 1-1-1z" />
    </symbol>
    <symbol id="i-grid" viewBox="0 0 24 24">
      <rect x="3.6" y="3.6" width="7" height="7" rx="1.8" />
      <rect x="13.4" y="3.6" width="7" height="7" rx="1.8" />
      <rect x="3.6" y="13.4" width="7" height="7" rx="1.8" />
      <rect x="13.4" y="13.4" width="7" height="7" rx="1.8" />
    </symbol>
    <symbol id="i-bars" viewBox="0 0 24 24">
      <path d="M5 21v-9" />
      <path d="M12 21V4" />
      <path d="M19 21v-6" />
    </symbol>
    <symbol id="i-spark" viewBox="0 0 24 24">
      <path d="M11.6 3.2 13.4 8l4.8 1.8-4.8 1.8-1.8 4.8-1.8-4.8L5 9.8 9.8 8z" />
      <path d="m18.2 15.4.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" />
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7" />
      <path d="m20.6 20.6-3.8-3.8" />
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14" />
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6 6 18" />
    </symbol>
    <symbol id="i-left" viewBox="0 0 24 24">
      <path d="M19.5 12h-15" />
      <path d="m10.5 6-6 6 6 6" />
    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24">
      <path d="M4 7h6.2M16.4 7H20M4 17h3.4M11.6 17H20" />
      <circle cx="13.2" cy="7" r="2.4" />
      <circle cx="9.4" cy="17" r="2.4" />
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M4 7h16" />
      <path d="M9.5 7V4.8h5V7" />
      <path d="m6.6 7 1.1 13h8.6L17.4 7" />
    </symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24">
      <rect x="3" y="6" width="18" height="13" rx="3" />
      <path d="M3 10.6h18" />
      <circle cx="16.4" cy="15.2" r="1.3" fill="currentColor" stroke="none" />
    </symbol>
    <symbol id="i-flame" viewBox="0 0 24 24">
      <path d="M12 3s5.2 4.2 5.2 9.2a5.2 5.2 0 0 1-10.4 0c0-2.1 1-3.5 1-3.5s1.2 2.3 2.5 2.3C10.3 8.6 12 6 12 3z" />
    </symbol>
    <symbol id="i-share" viewBox="0 0 24 24">
      <path d="M12 16V4" />
      <path d="m7.5 8.5 4.5-4.5 4.5 4.5" />
      <path d="M5 14v5.6h14V14" />
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24">
      <path d="M8 5.1v13.8L19.6 12z" fill="currentColor" stroke="none" />
    </symbol>
    <symbol id="i-pause" viewBox="0 0 24 24">
      <rect x="7" y="5" width="3.6" height="14" rx="1.2" fill="currentColor" stroke="none" />
      <rect x="13.4" y="5" width="3.6" height="14" rx="1.2" fill="currentColor" stroke="none" />
    </symbol>
    <symbol id="i-prev" viewBox="0 0 24 24">
      <path d="M19 6.2v11.6L9.4 12z" fill="currentColor" stroke="none" />
      <rect x="5" y="5.6" width="2.4" height="12.8" rx="1" fill="currentColor" stroke="none" />
    </symbol>
    <symbol id="i-next" viewBox="0 0 24 24">
      <path d="M5 6.2v11.6L14.6 12z" fill="currentColor" stroke="none" />
      <rect x="16.6" y="5.6" width="2.4" height="12.8" rx="1" fill="currentColor" stroke="none" />
    </symbol>
  </svg>

  <!-- ==== Экран входа ==== -->
  <div class="auth" id="authRoot" aria-live="polite"></div>

  <div class="app">
    <!-- ==== Sidebar (desktop) ==== -->
    <aside class="sidebar">
      <div class="panel panel-nav">
        <a class="logo" href="#/home" data-action="nav" data-to="/home">
          <span class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <circle cx="16" cy="16" r="16" fill="#1DB954" />
              <rect x="9" y="16" width="3" height="8" rx="1.5" fill="#04240f" />
              <rect x="14.5" y="9" width="3" height="15" rx="1.5" fill="#04240f" />
              <rect x="20" y="13" width="3" height="11" rx="1.5" fill="#04240f" />
            </svg>
          </span>
          <span class="logo-text">cashfy</span>
        </a>
        <nav class="nav" id="sideNav">
          <a class="nav-item" href="#/home" data-action="nav" data-to="/home" data-nav="home">
            <svg class="ic">
              <use href="#i-home" />
            </svg><span>Главная</span>
          </a>
          <a class="nav-item" href="#/search" data-action="nav" data-to="/search" data-nav="search">
            <svg class="ic">
              <use href="#i-search" />
            </svg><span>Поиск</span>
          </a>
          <a class="nav-item" href="#/categories" data-action="nav" data-to="/categories" data-nav="categories">
            <svg class="ic">
              <use href="#i-grid" />
            </svg><span>Категории</span>
          </a>
          <a class="nav-item" href="#/stats" data-action="nav" data-to="/stats" data-nav="stats">
            <svg class="ic">
              <use href="#i-bars" />
            </svg><span>Статистика</span>
          </a>
          <a class="nav-item" href="#/recap" data-action="nav" data-to="/recap" data-nav="recap">
            <svg class="ic">
              <use href="#i-spark" />
            </svg><span>Итоги</span>
          </a>
        </nav>
      </div>

      <div class="panel panel-lib">
        <div class="lib-head">
          <span>Категории</span>
          <button class="icon-btn" type="button" data-action="add" aria-label="Добавить трату">
            <svg class="ic">
              <use href="#i-plus" />
            </svg>
          </button>
        </div>
        <ul class="lib-list" id="sideCategories"></ul>
        <p class="lib-note">Данные живут только в твоём браузере.<br>Никаких банков и облаков.</p>
      </div>
    </aside>

    <!-- ==== Main ==== -->
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <!-- ==== Нижняя панель: сводка за сегодня ==== -->
  <div class="player" id="player" aria-label="Сводка за сегодня"></div>

  <!-- ==== Mobile nav ==== -->
  <nav class="mobile-nav" id="mobileNav" aria-label="Навигация"></nav>

  <!-- ==== Modal / toast ==== -->
  <div class="modal-root" id="modalRoot"></div>
  <div class="toast-root" id="toastRoot" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px;color:#fff;font-family:sans-serif">Для работы Cashfy нужен JavaScript.</p>
  </noscript>

  <script src="api.js"></script>
  <script src="data.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>

</html>
